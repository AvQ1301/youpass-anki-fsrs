<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouPass → Anki FSRS</title><link rel="stylesheet" href="/static/style.css"></head><body>
<main><header><div><h1>YouPass → Anki FSRS</h1><p>IELTS Reading, Listening, Writing and Speaking</p></div><div class="actions"><button id="sync">Synchronize exercises</button><button id="retry">Retry errors</button><a class="button secondary" href="/api/export.csv">Export CSV</a></div></header>
<section id="message" class="message" hidden></section><section id="stats" class="stats"></section>
<section class="panel"><h2>Score thresholds</h2><form id="thresholds"><label>Easy ≥ <input id="easy" type="number" min="0" max="100"></label><label>Good ≥ <input id="good" type="number" min="0" max="100"></label><label>Hard ≥ <input id="hard" type="number" min="0" max="100"></label><button>Save</button></form></section>
<section class="panel"><h2>Error tracking</h2><div id="error-summary"></div></section>
<section class="panel"><div class="panel-title"><div><h2>Exercises</h2><small id="result-count"></small></div><div class="filters"><select id="skill"><option value="">All skills</option><option>reading</option><option>listening</option><option>writing</option><option>speaking</option></select><input id="filter" type="search" autocomplete="off" placeholder="Search title or ID"></div></div><div class="table-wrap"><table><thead><tr><th>Skill</th><th>Title</th><th>Part</th><th>Question types / Topic</th><th>Score</th><th>Anki</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="loading">Loading…</td></tr></tbody></table></div><nav class="pagination"><button id="previous" class="secondary">Previous</button><span id="page-info">Page 1</span><button id="next" class="secondary">Next</button></nav></section></main><script defer src="/static/app.js"></script></body></html>
