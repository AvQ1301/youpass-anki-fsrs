[project]
name = "youpass-anki-fsrs"
version = "0.1.0"
description = "Local YouPass IELTS Reading to Anki FSRS bridge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "playwright>=1.49,<2",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
youpass-anki = "youpass_anki.main:run"
youpass-crawl = "youpass_anki.crawler:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youpass_anki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
